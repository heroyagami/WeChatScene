name: Render daily WeChat video

# Deterministic cloud renderer: content generation happens outside GitHub Actions.
on:
  push:
    branches:
      - main
    paths:
      - daily-input/latest.json
      - content/bgm/**
      - public/bgm/**
      - src/**
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json
      - .github/workflows/render-daily.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-wechat-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk ffmpeg
          fc-cache -f

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      - name: Read production metadata
        id: meta
        shell: bash
        run: |
          DATE=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('daily-input/latest.json','utf8'));process.stdout.write(x.date)")
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Prepare daily render
        run: npm run daily:prepare

      - name: Render full chat image
        run: npm run daily:long-image

      - name: Render 16:9 video
        run: npm run daily:render

      - name: Verify MP4 audio loudness
        shell: bash
        run: |
          AUDIO_STREAM=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 out/daily-wechat.mp4)
          test "$AUDIO_STREAM" = "audio"
          MEAN_DB=$(ffmpeg -hide_banner -i out/daily-wechat.mp4 -map 0:a:0 -af volumedetect -f null - 2>&1 | sed -n 's/.*mean_volume: \([-0-9.]*\) dB.*/\1/p' | tail -1)
          awk -v volume="$MEAN_DB" 'BEGIN { if (volume == "" || volume < -32) { print "MP4 audio is effectively silent: " volume " dB" > "/dev/stderr"; exit 1 } print "mean_volume=" volume " dB" }'

      - name: Package dated artifacts
        shell: bash
        run: |
          DATE="${{ steps.meta.outputs.date }}"
          mkdir -p artifacts
          cp out/daily-wechat.mp4 "artifacts/wechat-${DATE}.mp4"
          cp public/generated/daily-chat.png "artifacts/wechat-${DATE}.png"
          cp daily-input/latest.json "artifacts/wechat-${DATE}.json"
          cp generated/daily-manifest.json "artifacts/wechat-${DATE}-manifest.json"

      - name: Upload render artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wechat-${{ steps.meta.outputs.date }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
